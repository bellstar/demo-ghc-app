[project]
name = "demo-ghc-app"
version = "0.1.0"
description = "Console app template for Azure OpenAI with Microsoft Agent Framework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-openai>=1.0.0",
    "azure-identity>=1.24.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
demo-ghc-app = "demo_ghc_app.console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_ghc_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
